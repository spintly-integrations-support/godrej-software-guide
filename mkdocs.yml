site_name: Multiple Locks & Passcodes
site_url: https://spintly-integrations-support.github.io/godrej-software-guide/
site_description: What changes in the IoT9 B2C flows to support multiple locks per property and multiple passcodes per user
docs_dir: docs

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - toc.follow
    - search.highlight

extra_css:
  - stylesheets/extra.css?v=1

extra_javascript:
  - javascripts/diagrams.js?v=1

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Reading these pages: conventions.md
  - Flows:
      - 1. User Onboarding: user-onboarding.md
      - 2. Lock Onboarding: lock-onboarding.md
      - 3. Home: home.md
      - 4. Lock Control Panel: lock-control-panel.md
      - 5. User Management: user-management.md
      - 6. Activity Trail: activity-trail.md
      - 7. Lock Settings: lock-settings.md
      - 8. Notifications: notifications.md
      - 9. Profile and Account: profile-and-account.md
  - Reference:
      - Spintly API changes: api-changes.md
      - Config SDK v3: config-sdk-v3.md
      - Still to be confirmed: pending.md
